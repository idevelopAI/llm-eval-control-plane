name: Dashboard Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dashboard-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard-gate:
    name: Dashboard Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_VERSION: "24.19.0"
      NODE_LINUX_X64_SHA256: >-
        14b342e71204f811bde6153be8e04b62aef63c236fef92b55f9c83154b409647
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install checksum-pinned Node.js
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/node.tar.xz"
          install_dir="$RUNNER_TEMP/node"
          curl \
            --proto '=https' \
            --tlsv1.2 \
            --fail \
            --silent \
            --show-error \
            --location \
            "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz" \
            --output "$archive"
          printf '%s  %s\n' "$NODE_LINUX_X64_SHA256" "$archive" \
            | sha256sum --check --strict
          install -d -m 0755 "$install_dir"
          tar -xJf "$archive" --strip-components=1 -C "$install_dir"
          printf '%s\n' "$install_dir/bin" >> "$GITHUB_PATH"
          "$install_dir/bin/node" --version

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: "11.19.0"
          run_install: false

      - name: Verify toolchain
        run: |
          node --version
          pnpm --version

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Reject known high-severity vulnerabilities
        run: pnpm audit --audit-level=high

      - name: Validate dashboard
        run: pnpm run check
