name: Control Plane API Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: control-plane-api-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  control-plane-api-gate:
    name: Control Plane API Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          POSTGRES_DB: control_plane
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d control_plane"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CONTROL_PLANE_DATABASE_URL: postgresql+psycopg://postgres@127.0.0.1:5432/control_plane
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          python-version: "3.11"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Check committed OpenAPI contract
        run: uv run python scripts/export_openapi.py --check

      - name: Validate local Compose topology
        run: docker compose --env-file .env.example config --quiet

      - name: Smoke-test the hardened Compose stack
        shell: bash
        run: |
          install -d -m 0700 .secrets
          printf '%s\n' 'ephemeral-compose-ci-only' > .secrets/postgres-password.txt
          chmod 0444 .secrets/postgres-password.txt
          docker compose up --build --detach --wait
          curl --fail --silent --show-error http://127.0.0.1:8000/health/ready

      - name: Remove Compose smoke-test resources
        if: always()
        run: docker compose down --volumes --remove-orphans

      - name: Migrate an empty database to head
        run: uv run alembic upgrade head

      - name: Check migration metadata drift
        run: uv run alembic check

      - name: Smoke-test downgrade and upgrade
        shell: bash
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Prove durable PostgreSQL API behavior
        run: >-
          uv run pytest -q
          tests/integration/test_control_plane_postgres_workflow.py

      - name: Build the production image
        run: docker build --tag llm-eval-control-plane:ci .
