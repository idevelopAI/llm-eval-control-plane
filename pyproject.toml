[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "llm-eval-control-plane"
version = "0.1.0.dev0"
description = "Deterministic evaluation and release gates for AI applications"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["ai-evaluation", "llm", "llmops", "rag", "text-to-sql"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "jsonschema>=4.23,<5",
  "pydantic>=2.11,<3",
  "rfc8785>=0.1,<1",
  "typer>=0.16,<1",
]

[project.scripts]
llm-eval = "llm_eval_control_plane.cli:app"

[project.urls]
Repository = "https://github.com/idevelopAI/llm-eval-control-plane"
Issues = "https://github.com/idevelopAI/llm-eval-control-plane/issues"

[dependency-groups]
dev = [
  "mypy>=1.15,<3",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
  "types-jsonschema>=4.23,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/llm_eval_control_plane"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["llm_eval_control_plane"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "N", "PERF", "PIE", "RUF", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.format]
quote-style = "double"
